bot:
  name: "罐头喵"      # bot 显示名
  master_id: "YOUR_QQ_ID"   # 主人QQ(最高权限)
  admin_ids: []          # 额外管理员
  prefix: "/"
  long_message_forward: true     # 长消息用合并转发发送
  long_message_threshold: 200    # 超过此字符数(约200汉字即霸屏)使用合并转发

onebot:
  ws_url: "ws://127.0.0.1:3001"
  token: "YOUR_ONE_BOT_TOKEN"
  self_id: "YOUR_BOT_QQ_ID"

data:
  dir: "./data"
  file_retention_days: 7    # 缓存文件保留天数, 0=不自动清理

ai:
  # 以下三项作为"初始默认提供商"在首次启动时导入 data/providers.json,
  # 之后可在 QQ 中通过 /provider add 动态添加/切换多个提供商, 无需改配置文件。
  base_url: "https://api.deepseek.com/v1"   # OpenAI 兼容接口
  api_key: "YOUR_API_KEY"  # 你的 API Key
  model: "deepseek-chat"
  system_prompt: |
    你是一个运行在 QQ 群里的智能助手, 名字叫 罐头喵。
    回答要简洁、友好, 使用中文。
    你可以使用提供的工具来帮助用户, 但不要滥用。

    工作方式:
    1. 当用户请求的信息不完整时, 使用 ask_user 工具一次性提出所有需要确认的问题, 等用户统一回答后再继续。
    2. 调用工具执行具体操作。涉及发送消息、修改数据等操作会经过人工审核, 无需你额外询问。
    3. 回答要直接给出结果, 不要长篇解释过程。
  max_tokens: 2048
  temperature: 0.7
  timeout: 120
  default_on: false
  max_history: 200        # 每个会话保留的历史消息数
  session_mode: merged    # 群会话模式: merged=全群合并 / separate=按用户独立
  mention_only: false
  reply_probability: 0
  context_window: 65536   # 模型上下文窗口(token), 压缩阈值取此值的 95%
  compact_token: 0        # 显式指定压缩阈值(优先级高于 context_window), 0=自动
  max_iterations: 200     # Agent 工具调用最大轮数
  tool_result_max: 3000   # 工具结果最大字符数(超出截断)

memory:
  enabled: true                       # 记忆机制开关
  embed_base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  # 向量化 API
  embed_api_key: "YOUR_DASHSCOPE_API_KEY"
  embed_model: "text-embedding-v4"    # 向量模型
  recall_limit: 5
  vision_model: "qwen3.6-flash"       # 识图转述模型

mood:
  enabled: true
  proactive: true     # 主动回复开关(每N条群消息后按心情决定是否搭话)
  every_n: 10
  remember_tool: true # 给 AI 主动记忆工具(remember)
  cooldown_min_minutes: 5    # 插话冷却最小分钟(普通搭话后)
  cooldown_max_minutes: 15   # 插话冷却最大分钟(实际取 min~max 随机区间, 防刷屏更自然)
  care_cooldown_minutes: 2   # 情感关怀冷却分钟(用户低落安慰后, 更短便于继续关心)
  punish_enabled: true       # 心情驱动自主管理操作: 心情极差时对惹怒 bot 的用户禁言/改昵称(AI自主, 免审批)
  punish_mood_threshold: 30  # 自主惩罚心情阈值: 值低于此或情绪为 angry 时可能触发
  punish_cooldown_minutes: 30 # 自主惩罚间隔(防反复惩罚同一人)

persona:
  enabled: true
  base: |
    你是一个叫 罐头喵 的智能助手, 性格友善、幽默、有耐心。
    你说话简洁自然, 偶尔带点轻松的语气, 但不会过度卖萌。
    你乐于助人, 善于倾听, 尊重每位用户。
  self_improve: true  # 自我优化: 从对话中学习用户偏好调整人设
  improve_every: 20

web:
  enabled: true                       # Web 搜索/爬取/浏览器能力
  proxy: ""                           # 访问国外网站走代理, 例: http://127.0.0.1:7890
  browser_path: "./scripts/browser.py" # Playwright 脚本路径

sched:
  enabled: true        # 定时任务服务
  schedule_tool: true

media:
  enabled: true                              # 图像生成/TTS
  base_url: "https://dashscope.aliyuncs.com" # DashScope API
  api_key: "YOUR_DASHSCOPE_API_KEY"
  image_model: "qwen-image-2.0"          # 图像生成模型(同步接口)
  tts_endpoint: "qwen3-tts-flash"            # TTS 模型
  voice: "Bella"                            # 默认音色

acp:
  enabled: true         # 调用 opencode 干活
  binary: "opencode"    # opencode 二进制(可用绝对路径)
  cwd: "./"             # 默认工作目录
  tool: true            # 给 AI 提供 opencode_task 工具
  timeout: 300          # 单任务超时秒

mcp:
  servers:
    - name: filesystem
      transport: stdio
      command: "npx"
      args:
        - "-y"
        - "@modelcontextprotocol/server-filesystem"
        - "/root"
      env: []
      enabled: false

skills:
  dir: "./skills"

plugin:
  dir: "./plugins"

group_request:
  enabled: true   # 入群申请管理(bot 是群管理时生效)

features:                 # 细粒度功能开关, 缺省(不写)均为开启
  quote: true           # 引用消息注入 + view_message 工具
  at_parse: true        # 收到的 @ 解析为 [@昵称(QQ)]
  at_send: true         # 回复中 [@QQ号] 转为真实 at
  file_fallback: true   # 私聊文件/图片无url时兜底接收
  group_file_save: true # 群文件自动保存
  file_recv_hint: true  # 收到文件提示 AI
  silent_deny: true     # 群内无权限命令静默
  env_inject: true      # 群上下文注入[当前环境]
  group_meta: true      # 群 meta 信息 + get_member_info 工具
  msg_timestamp: true   # 历史消息时间戳
